# Cidna static site — nginx.  HTTPS: sudo certbot --nginx -d cidna.ir -d www.cidna.ir
server {
    listen 80; listen [::]:80;
    server_name cidna.ir www.cidna.ir;
    location /.well-known/acme-challenge/ { root /var/www/cidna; }
    location / { return 301 https://cidna.ir$request_uri; }
}
server {
    listen 443 ssl; listen [::]:443 ssl; http2 on;
    server_name www.cidna.ir;
    # ssl_certificate / ssl_certificate_key: added by Certbot
    return 301 https://cidna.ir$request_uri;
}
server {
    listen 443 ssl; listen [::]:443 ssl; http2 on;
    server_name cidna.ir;
    # ssl_certificate / ssl_certificate_key: added by Certbot
    root /var/www/cidna;
    index index.html;
    charset utf-8;
    server_tokens off;

    gzip on; gzip_vary on; gzip_comp_level 6; gzip_min_length 512;
    gzip_types text/css application/javascript application/json application/xml image/svg+xml application/manifest+json text/plain;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    error_page 404 /404.html;
    location = /404.html { internal; }

    # لینک‌های داخل اپ (BASE_URL + "privacy-policy" ...) → صفحهٔ وب‌سایت
    location = /privacy-policy    { return 301 /privacy/; }
    location = /privacy-policy/   { return 301 /privacy/; }
    location = /en/privacy-policy { return 301 /en/privacy/; }

    # /index.html → آدرس تمیز، و افزودن / انتهایی (جلوگیری از محتوای تکراری)
    location ~ ^(.*)/index\.html$ { return 301 $1/; }
    rewrite ^([^.?]*[^/])$ $1/ permanent;

    location / { try_files $uri $uri/index.html =404; add_header Cache-Control "no-cache"; }
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header Access-Control-Allow-Origin "*";
        try_files $uri =404;
    }
    location = /sitemap.xml { add_header Cache-Control "public, max-age=3600"; }
    location = /robots.txt  { add_header Cache-Control "public, max-age=3600"; }
    location ~ /\.(?!well-known) { deny all; }
}
