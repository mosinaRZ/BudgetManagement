services:
  mongo-test:
    image: mongo:7
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27018:27017"
    volumes:
      - mongo_test_data:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --eval
          "try { rs.status().ok } catch (e) {
          rs.initiate({_id:'rs0', members:[{_id:0, host:'mongo-test:27017'}]}).ok
          }"
      interval: 5s
      timeout: 10s
      retries: 20

volumes:
  mongo_test_data:
