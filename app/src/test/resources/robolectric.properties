# Robolectric 4.14.1 ships Android SDKs up to 35, while the app targets 36.
# Without this, every Robolectric test that has no explicit @Config(sdk = ...) fails with
# "Package targetSdkVersion=36 > maxSdkVersion=35". Remove this file after upgrading
# Robolectric to a release that supports API 36.
sdk=35
